name: Sync Core Files to Templates

# Trigger on push to main or manual workflow_dispatch
on:
  push:
    branches:
      - main
    paths:
      - '_includes/**'
      - '_layouts/**'
      - 'assets/**'
      - 'docs/**'
      - 'scrollstories/**'
      - 'scripts/sync-core-files.sh'
      # The image tools ship to every template; a fix to them alone should too
      - 'scripts/optimize-images.sh'
      - 'scripts/update-image-refs.sh'
      - '.github/workflows/optimize-images.yml'
      - 'Gemfile'
      - '.gitignore'
      - '_config.yml'
      # Editing the workflow itself should re-run it — otherwise a change like
      # enabling a template's job sits idle until some other file happens to move.
      - '.github/workflows/sync-templates.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual push)'
        required: false
        default: 'false'
      template:
        description: 'Sync specific template only (or "all")'
        required: false
        default: 'all'

env:
  # Carries .github/workflows/optimize-images.yml to the templates, so a site
  # made from one inherits the Actions button for shrinking images. Requires
  # SYNC_TOKEN to hold the `workflow` scope; without it GitHub rejects the whole
  # push, not just that file.
  SYNC_WORKFLOW_FILE: "true"
  GIT_AUTHOR_NAME: "Xanthan Sync Bot"
  GIT_AUTHOR_EMAIL: "actions@github.com"
  GIT_COMMITTER_NAME: "Xanthan Sync Bot"
  GIT_COMMITTER_EMAIL: "actions@github.com"

jobs:
  sync-portfolio-template:
    if: github.event.inputs.template == 'all' || github.event.inputs.template == 'portfolio' || github.event.inputs.template == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xanthan main
        uses: actions/checkout@v4
        with:
          path: xanthan-source
          fetch-depth: 2

      - name: Checkout portfolio-template
        uses: actions/checkout@v4
        with:
          repository: xanthan-web/portfolio-template
          token: ${{ secrets.SYNC_TOKEN }}
          path: portfolio-template

      - name: Sync core files to portfolio-template
        run: |
          bash xanthan-source/scripts/sync-core-files.sh \
            xanthan-source portfolio-template portfolio

          # Show what changed
          cd portfolio-template
          git status -s

      - name: Create PR or push changes
        run: |
          cd portfolio-template

          if [[ -z $(git status -s) ]]; then
            echo "✓ No changes to commit"
            exit 0
          fi

          # Dry run mode - just show what would be committed
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "DRY RUN - Would commit these changes:"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            git diff --stat
            exit 0
          fi

          # Actual commit and push
          git add -A

          # Get the original commit message from xanthan and save to file
          cd ../xanthan-source
          git log -1 --pretty=%B HEAD > /tmp/commit-msg.txt
          cd ../portfolio-template

          # Create detailed commit message using original message
          {
            cat /tmp/commit-msg.txt
            echo ""
            echo "Synced from xanthan commit: ${{ github.sha }}"
            echo ""
            echo "Changes:"
            git diff --cached --stat
            echo ""
            echo "[skip ci]"
          } > /tmp/final-commit-msg.txt

          git commit -F /tmp/final-commit-msg.txt
          git push

          echo "✓ Changes pushed to portfolio-template"

  sync-scrollstory-template:
