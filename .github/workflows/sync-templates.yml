          token: ${{ secrets.SYNC_TOKEN }}
          path: object-collection-template

      - name: Sync core files to object-collection-template
        run: |
          bash xanthan-source/scripts/sync-core-files.sh \
            xanthan-source object-collection-template object-collection

          cd object-collection-template
          git status -s

      - name: Create PR or push changes
        run: |
          cd object-collection-template

          if [[ -z $(git status -s) ]]; then
            echo "✓ No changes to commit"
            exit 0
          fi

          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            git diff --stat
            exit 0
          fi

          git add -A
          cd ../xanthan-source
          git log -1 --pretty=%B HEAD > /tmp/commit-msg.txt
          cd ../object-collection-template

          {
            cat /tmp/commit-msg.txt
            echo ""
            echo "Synced from xanthan commit: ${{ github.sha }}"
            echo ""
            echo "[skip ci]"
          } > /tmp/final-commit-msg.txt

          git commit -F /tmp/final-commit-msg.txt
