  # ---------------------------------------------------------------------------
  # Object Collection starter site. Enabled once the repository existed with a
  # branch to check out — actions/checkout fails against an empty repository as
  # surely as against a missing one.
  # ---------------------------------------------------------------------------
  sync-object-collection-template:
    if: github.event.inputs.template == 'all' || github.event.inputs.template == 'object-collection' || github.event.inputs.template == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xanthan main
        uses: actions/checkout@v4
