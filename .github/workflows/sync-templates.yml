            echo "DRY RUN - Would commit these changes:"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            git diff --stat
            exit 0
          fi

          git add -A

          # Get the original commit message from xanthan and save to file
          cd ../xanthan-source
          git log -1 --pretty=%B HEAD > /tmp/commit-msg.txt
          cd ../class-project-template

